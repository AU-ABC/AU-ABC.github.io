on: 
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  push:
    branches: main
  workflow_dispatch:

name: Quarto Publish

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v6
#        with:
#          python-version: '3.9'

      - name: Install libcurl on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev

      - name: Install packages for tables on quarto
        if: runner.os == 'Linux'
        run: pip install jupyter pandas openpyxl requests itables pandas ipython

#      - name: Check out repository
#        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        with:
          tinytex: true

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages